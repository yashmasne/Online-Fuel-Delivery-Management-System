<!DOCTYPE html>
<html lang="en"><head><base href="/Online_Fuel_Delivery_Management_System/">
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>FuelExpress Admin - Orders &amp; Users</title>
<script src="https://cdn.tailwindcss.com?plugins=forms"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
  tailwind.config = { theme: { extend: {
      "colors": { "primary": "#004ac6", "secondary-container": "#fd761a", "surface": "#f7f9fb" }
  }}}
</script>
<style>body{font-family:'Inter',sans-serif;background:#f7f9fb;} .glass-card{background:rgba(255,255,255,.95);box-shadow:0 4px 12px rgba(30,41,59,.05);}</style>
</head>
<body class="min-h-screen flex">
<aside class="fixed left-0 top-0 h-screen w-[260px] bg-white border-r border-gray-200 flex flex-col py-4 px-3">
    <div class="px-3 mb-8">
        <h1 class="text-xl font-bold text-primary">FuelExpress</h1>
        <p class="text-xs text-gray-500">Admin Console</p>
    </div>
    <nav class="flex-1 space-y-1">
        <a class="flex items-center gap-3 px-3 py-2 rounded-lg text-gray-600 hover:bg-gray-100" href="Admin_Dashboard.html"><span class="material-symbols-outlined">monitoring</span> Analytics</a>
        <a class="flex items-center gap-3 px-3 py-2 rounded-lg bg-primary/10 text-primary font-bold" href="Admin_Orders_Users.html"><span class="material-symbols-outlined">local_gas_station</span> Orders &amp; Users</a>
        <a class="flex items-center gap-3 px-3 py-2 rounded-lg text-gray-600 hover:bg-gray-100" href="Admin_Team.html"><span class="material-symbols-outlined">groups</span> Manage Team</a>
    </nav>
    <div class="pt-4 border-t border-gray-200">
        <a href="logout" class="flex items-center gap-3 px-3 py-2 rounded-lg text-gray-600 hover:bg-gray-100"><span class="material-symbols-outlined">logout</span> Logout</a>
    </div>
</aside>

<main class="flex-1 ml-[260px] p-8 space-y-4">
    <div class="flex gap-2 border-b border-gray-200">
        <button id="tab-orders-btn" class="px-4 py-3 font-bold text-primary border-b-2 border-primary">Platform Orders</button>
        <button id="tab-users-btn" class="px-4 py-3 font-bold text-gray-500 border-b-2 border-transparent">Users</button>
    </div>

    <!-- ORDERS -->
    <section id="orders-view">
        <div class="glass-card rounded-xl overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left">
                    <thead>
                        <tr class="bg-gray-50 border-b border-gray-200 text-sm text-gray-500">
                            <th class="px-4 py-3">Order</th><th class="px-4 py-3">Customer</th><th class="px-4 py-3">Fuel</th>
                            <th class="px-4 py-3">Qty</th><th class="px-4 py-3">Delivery Status</th>
                            <th class="px-4 py-3">Payment</th><th class="px-4 py-3 text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="orders-body"><tr><td class="px-4 py-6 text-gray-500" colspan="7">Loading...</td></tr></tbody>
                </table>
            </div>
        </div>
    </section>

    <!-- USERS -->
    <section id="users-view" class="hidden">
        <div class="glass-card rounded-xl overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left">
                    <thead>
                        <tr class="bg-gray-50 border-b border-gray-200 text-sm text-gray-500">
                            <th class="px-4 py-3">Name</th><th class="px-4 py-3">Email</th><th class="px-4 py-3">Phone</th>
                            <th class="px-4 py-3">City</th><th class="px-4 py-3">Status</th><th class="px-4 py-3 text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="users-body"><tr><td class="px-4 py-6 text-gray-500" colspan="6">Loading...</td></tr></tbody>
                </table>
            </div>
        </div>
    </section>
</main>

<script>
    function showTab(tab) {
        document.getElementById('orders-view').classList.toggle('hidden', tab !== 'orders');
        document.getElementById('users-view').classList.toggle('hidden', tab !== 'users');
        document.getElementById('tab-orders-btn').className = 'px-4 py-3 font-bold border-b-2 ' + (tab === 'orders' ? 'text-primary border-primary' : 'text-gray-500 border-transparent');
        document.getElementById('tab-users-btn').className = 'px-4 py-3 font-bold border-b-2 ' + (tab === 'users' ? 'text-primary border-primary' : 'text-gray-500 border-transparent');
        if (tab === 'users') loadUsers();
    }
    document.getElementById('tab-orders-btn').addEventListener('click', () => showTab('orders'));
    document.getElementById('tab-users-btn').addEventListener('click', () => showTab('users'));

    const orderStatusOptions = ['PENDING', 'CONFIRMED', 'ASSIGNED', 'OUT_FOR_DELIVERY', 'DELIVERED', 'CANCELLED'];
    let availableAgents = [];

    function loadAgents() {
        return fetch('adminManagement?action=allAgents')
            .then(r => r.json())
            .then(agents => { availableAgents = agents.filter(a => a.availabilityStatus === 'AVAILABLE'); });
    }

    function loadOrders() {
        Promise.all([
            fetch('adminManagement?action=allOrders').then(r => {
                if (r.status === 403) { window.location.href = 'Auth_Pages.html?mode=admin'; throw new Error('login required'); }
                return r.json();
            }),
            loadAgents()
        ]).then(([orders]) => {
            const body = document.getElementById('orders-body');
            if (orders.length === 0) {
                body.innerHTML = '<tr><td class="px-4 py-6 text-gray-500" colspan="7">No orders yet.</td></tr>';
                return;
            }
            body.innerHTML = '';
            orders.forEach(o => {
                const tr = document.createElement('tr');
                tr.className = 'border-b border-gray-100 last:border-0';

                const statusSelect = orderStatusOptions.map(s =>
                    `<option value="${s}" ${s === o.orderStatus ? 'selected' : ''}>${s.replaceAll('_',' ')}</option>`).join('');

                const agentControl = o.agentId
                    ? `<span class="text-sm text-gray-600">${o.agentName}</span>`
                    : `<select class="assign-agent-select text-sm border border-gray-300 rounded px-2 py-1" data-order-id="${o.orderId}">
                         <option value="">Assign agent...</option>
                         ${availableAgents.map(a => `<option value="${a.agentId}">${a.fullName}</option>`).join('')}
                       </select>`;

                tr.innerHTML = `
                    <td class="px-4 py-4 font-semibold text-primary">${o.orderNumber}</td>
                    <td class="px-4 py-4">${o.customerName}</td>
                    <td class="px-4 py-4">${o.fuelName}</td>
                    <td class="px-4 py-4">${o.quantity} L</td>
                    <td class="px-4 py-4">
                        <select class="status-select text-sm border border-gray-300 rounded px-2 py-1" data-order-id="${o.orderId}">${statusSelect}</select>
                    </td>
                    <td class="px-4 py-4"><span class="px-2 py-1 rounded-full text-xs font-bold ${o.paymentStatus === 'PAID' ? 'bg-blue-100 text-blue-700' : 'bg-yellow-100 text-yellow-700'}">${o.paymentStatus}</span></td>
                    <td class="px-4 py-4 text-right">${agentControl}</td>`;
                body.appendChild(tr);
            });

            document.querySelectorAll('.status-select').forEach(sel => {
                sel.addEventListener('change', function () {
                    fetch('adminManagement?action=updateOrderStatus', {
                        method: 'POST',
                        body: new URLSearchParams({ orderId: this.dataset.orderId, status: this.value })
                    }).then(() => loadOrders());
                });
            });
            document.querySelectorAll('.assign-agent-select').forEach(sel => {
                sel.addEventListener('change', function () {
                    if (!this.value) return;
                    fetch('adminManagement?action=assignAgent', {
                        method: 'POST',
                        body: new URLSearchParams({ orderId: this.dataset.orderId, agentId: this.value })
                    }).then(() => loadOrders());
                });
            });
        }).catch(() => {});
    }

    function loadUsers() {
        fetch('adminManagement?action=allUsers')
            .then(r => r.json())
            .then(users => {
                const body = document.getElementById('users-body');
                if (users.length === 0) {
                    body.innerHTML = '<tr><td class="px-4 py-6 text-gray-500" colspan="6">No customers yet.</td></tr>';
                    return;
                }
                body.innerHTML = '';
                users.forEach(u => {
                    const tr = document.createElement('tr');
                    tr.className = 'border-b border-gray-100 last:border-0';
                    const isActive = u.status === 'ACTIVE';
                    tr.innerHTML = `
                        <td class="px-4 py-4 font-semibold">${u.fullName}</td>
                        <td class="px-4 py-4">${u.email}</td>
                        <td class="px-4 py-4">${u.phone || '-'}</td>
                        <td class="px-4 py-4">${u.city || '-'}</td>
                        <td class="px-4 py-4"><span class="px-2 py-1 rounded-full text-xs font-bold ${isActive ? 'bg-green-100 text-green-700' : 'bg-gray-200 text-gray-600'}">${u.status}</span></td>
                        <td class="px-4 py-4 text-right">
                            <button class="toggle-status-btn text-sm font-bold ${isActive ? 'text-red-600' : 'text-green-700'} hover:underline"
                                    data-user-id="${u.userId}" data-next-status="${isActive ? 'INACTIVE' : 'ACTIVE'}">
                                ${isActive ? 'Deactivate' : 'Activate'}
                            </button>
                        </td>`;
                    body.appendChild(tr);
                });
                document.querySelectorAll('.toggle-status-btn').forEach(btn => {
                    btn.addEventListener('click', function () {
                        fetch('adminManagement?action=toggleUserStatus', {
                            method: 'POST',
                            body: new URLSearchParams({ userId: this.dataset.userId, status: this.dataset.nextStatus })
                        }).then(() => loadUsers());
                    });
                });
            })
            .catch(() => {});
    }

    loadOrders();
</script>
</body></html>
