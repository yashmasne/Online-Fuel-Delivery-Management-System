<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>FuelExpress | Delivery Agent Dashboard</title>
<script src="https://cdn.tailwindcss.com?plugins=forms"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
  tailwind.config = { theme: { extend: {
      "colors": { "primary": "#004ac6", "secondary-container": "#fd761a", "surface": "#f7f9fb" }
  }}}
</script>
<style>body{font-family:'Inter',sans-serif;background:#f7f9fb;}</style>
</head>
<body class="min-h-screen">
<header class="sticky top-0 z-40 bg-white/80 backdrop-blur-md border-b border-gray-200 h-[72px] flex items-center justify-between px-6">
    <span class="text-2xl font-bold text-primary">FuelExpress</span>
    <div class="flex items-center gap-4">
        <div id="status-toggle" class="flex items-center gap-2 bg-gray-100 px-4 py-2 rounded-full cursor-pointer hover:bg-gray-200 transition-colors">
            <div id="status-indicator" class="w-3 h-3 rounded-full bg-green-500"></div>
            <span id="status-text" class="font-semibold text-sm">Available</span>
        </div>
        <div class="relative">
            <button id="notif-bell" class="relative w-10 h-10 flex items-center justify-center rounded-full hover:bg-gray-100 transition-colors">
                <span class="material-symbols-outlined text-gray-700">notifications</span>
                <span id="notif-badge" class="hidden absolute top-0.5 right-0.5 bg-red-500 text-white text-[10px] font-bold rounded-full min-w-[16px] h-[16px] flex items-center justify-center px-1">0</span>
            </button>
            <div id="notif-dropdown" class="hidden absolute right-0 mt-2 w-80 bg-white rounded-xl shadow-xl border border-gray-200 max-h-96 overflow-y-auto z-50">
                <div class="flex items-center justify-between px-4 py-3 border-b border-gray-100 sticky top-0 bg-white">
                    <span class="font-bold text-sm">Notifications</span>
                    <button id="notif-mark-all" class="text-xs text-primary font-semibold hover:underline">Mark all read</button>
                </div>
                <div id="notif-list"><p class="text-gray-400 text-sm p-4">No notifications yet.</p></div>
            </div>
        </div>
        <a href="logout" class="text-primary font-semibold hover:underline">Logout</a>
    </div>
</header>

<div id="toast-container" class="fixed top-20 right-6 z-50 space-y-2 w-80"></div>

<main class="max-w-5xl mx-auto p-6 space-y-6">
    <section class="grid grid-cols-1 md:grid-cols-3 gap-6">
        <div class="bg-gradient-to-br from-secondary-container to-orange-500 p-6 rounded-2xl text-white shadow-lg">
            <p class="text-sm opacity-90 uppercase tracking-wider">Assigned Orders</p>
            <h2 id="stat-assigned" class="text-3xl font-bold mt-2">-</h2>
        </div>
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-200">
            <p class="text-sm text-gray-500">Delivered</p>
            <h2 id="stat-delivered" class="text-3xl font-bold mt-2">-</h2>
        </div>
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-200">
            <p class="text-sm text-gray-500">In Progress</p>
            <h2 id="stat-in-progress" class="text-3xl font-bold mt-2 text-primary">-</h2>
        </div>
    </section>

    <section class="space-y-4">
        <h3 class="text-xl font-bold">Available Orders <span class="text-sm font-normal text-gray-500">nearby orders no one has accepted yet</span></h3>
        <div id="available-orders-list" class="space-y-4">
            <p class="text-gray-500">Checking for available orders...</p>
        </div>
    </section>

    <section class="space-y-4">
        <h3 class="text-xl font-bold">Your Deliveries</h3>
        <div id="orders-list" class="space-y-4">
            <p class="text-gray-500">Loading your assigned orders...</p>
        </div>
    </section>
</main>

<script>
    let isAvailable = true;

    document.getElementById('status-toggle').addEventListener('click', function () {
        isAvailable = !isAvailable;
        const newStatus = isAvailable ? 'AVAILABLE' : 'BUSY';
        fetch('deliveryAgent?action=updateAvailability', { method: 'POST', body: new URLSearchParams({ status: newStatus }) })
            .then(r => r.json())
            .then(() => {
                document.getElementById('status-indicator').className = 'w-3 h-3 rounded-full ' + (isAvailable ? 'bg-green-500' : 'bg-red-500');
                document.getElementById('status-text').textContent = isAvailable ? 'Available' : 'Busy';
            });
    });

    function loadOrders() {
        fetch('deliveryAgent?action=myOrders')
            .then(r => {
                if (r.status === 401) { window.location.href = 'Auth_Pages.html?mode=agent'; throw new Error('login required'); }
                return r.json();
            })
            .then(orders => {
                document.getElementById('stat-assigned').textContent = orders.length;
                document.getElementById('stat-delivered').textContent = orders.filter(o => o.orderStatus === 'DELIVERED').length;
                document.getElementById('stat-in-progress').textContent = orders.filter(o =>
                    o.orderStatus === 'ASSIGNED' || o.orderStatus === 'OUT_FOR_DELIVERY').length;

                const container = document.getElementById('orders-list');
                const active = orders.filter(o => o.orderStatus !== 'DELIVERED' && o.orderStatus !== 'CANCELLED');

                if (active.length === 0) {
                    container.innerHTML = '<p class="text-gray-500">No active deliveries assigned right now.</p>';
                    return;
                }
                container.innerHTML = '';
                active.forEach(o => {
                    const hasLiveLocation = Number(o.latitude) !== 0 || Number(o.longitude) !== 0;
                    const mapsUrl = hasLiveLocation
                        ? `https://www.google.com/maps/search/?api=1&query=${o.latitude},${o.longitude}`
                        : `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(o.deliveryAddress)}`;

                    const card = document.createElement('div');
                    card.className = 'bg-white rounded-2xl p-6 shadow-sm border border-gray-200 flex flex-col md:flex-row gap-6 justify-between';
                    card.innerHTML = `
                        <div class="space-y-2 flex-1">
                            <div class="flex justify-between">
                                <span class="text-xs font-bold text-primary bg-primary/10 px-3 py-1 rounded-full">${o.orderStatus.replaceAll('_',' ')}</span>
                                <span class="text-xs text-gray-500">Ref: ${o.orderNumber}</span>
                            </div>
                            <h4 class="text-lg font-bold">${o.customerName}</h4>
                            <p class="text-sm text-gray-600 flex items-center gap-1">
                                <span class="material-symbols-outlined text-base">location_on</span> ${o.deliveryAddress}
                            </p>
                            ${hasLiveLocation ? `
                            <p class="text-xs font-semibold text-green-700 flex items-center gap-1">
                                <span class="material-symbols-outlined text-sm">my_location</span> Live location shared by customer
                            </p>
                            <div class="rounded-lg overflow-hidden border border-gray-200 my-1">
                                <iframe width="100%" height="160" style="border:0" loading="lazy"
                                    src="https://www.google.com/maps?q=${o.latitude},${o.longitude}&z=15&output=embed"></iframe>
                            </div>` : ''}
                            <a href="${mapsUrl}" target="_blank" rel="noopener" class="inline-flex items-center gap-1 text-sm font-bold text-primary hover:underline">
                                <span class="material-symbols-outlined text-base">directions</span> Get Directions
                            </a>
                            <div class="flex gap-6 border-t border-gray-100 pt-3 text-sm">
                                <div><p class="text-gray-500">Fuel</p><p class="font-semibold">${o.fuelName}</p></div>
                                <div><p class="text-gray-500">Volume</p><p class="font-semibold">${o.quantity} L</p></div>
                                <div><p class="text-gray-500">Amount</p><p class="font-semibold">&#8377;${Number(o.totalAmount).toFixed(2)}</p></div>
                            </div>
                        </div>
                        <div class="flex flex-col gap-2 md:w-[180px] justify-center">
                            ${o.orderStatus === 'ASSIGNED' ? `
                            <button class="start-delivery-btn bg-secondary-container text-white font-bold py-3 rounded-xl hover:scale-[1.02] transition-transform" data-order-id="${o.orderId}">
                                Start Delivery
                            </button>` : `
                            <button class="mark-delivered-btn bg-primary text-white font-bold py-3 rounded-xl hover:scale-[1.02] transition-transform" data-order-id="${o.orderId}">
                                Mark Delivered
                            </button>`}
                        </div>`;
                    container.appendChild(card);
                });

                document.querySelectorAll('.start-delivery-btn').forEach(btn => {
                    btn.addEventListener('click', function () {
                        if (!confirm('Start this delivery? The customer will be notified and live tracking will begin.')) return;
                        fetch('deliveryAgent?action=startDelivery', { method: 'POST', body: new URLSearchParams({ orderId: this.dataset.orderId }) })
                            .then(r => r.json())
                            .then(() => loadOrders());
                    });
                });

                document.querySelectorAll('.mark-delivered-btn').forEach(btn => {
                    btn.addEventListener('click', function () {
                        if (!confirm('Mark this order as delivered?')) return;
                        fetch('deliveryAgent?action=markDelivered', { method: 'POST', body: new URLSearchParams({ orderId: this.dataset.orderId }) })
                            .then(r => r.json())
                            .then(() => loadOrders());
                    });
                });
            })
            .catch(() => {});
    }

    function loadAvailableOrders() {
        fetch('deliveryAgent?action=availableOrders')
            .then(r => r.ok ? r.json() : [])
            .then(orders => {
                const container = document.getElementById('available-orders-list');
                container.innerHTML = '';
                if (!orders.length) {
                    container.innerHTML = '<p class="text-gray-500">No unclaimed orders right now.</p>';
                    return;
                }
                orders.forEach(o => {
                    const card = document.createElement('div');
                    card.className = 'bg-white rounded-2xl p-6 shadow-sm border border-dashed border-primary/40 flex flex-col md:flex-row gap-6 justify-between';
                    card.innerHTML = `
                        <div class="space-y-2 flex-1">
                            <div class="flex justify-between">
                                <span class="text-xs font-bold text-secondary-container bg-secondary-container/10 px-3 py-1 rounded-full">UNCLAIMED</span>
                                <span class="text-xs text-gray-500">Ref: ${o.orderNumber}</span>
                            </div>
                            <h4 class="text-lg font-bold">${o.customerName}</h4>
                            <p class="text-sm text-gray-600 flex items-center gap-1">
                                <span class="material-symbols-outlined text-base">location_on</span> ${o.deliveryAddress}
                            </p>
                            <div class="flex gap-6 border-t border-gray-100 pt-3 text-sm">
                                <div><p class="text-gray-500">Fuel</p><p class="font-semibold">${o.fuelName}</p></div>
                                <div><p class="text-gray-500">Volume</p><p class="font-semibold">${o.quantity} L</p></div>
                                <div><p class="text-gray-500">Amount</p><p class="font-semibold">&#8377;${Number(o.totalAmount).toFixed(2)}</p></div>
                            </div>
                        </div>
                        <div class="flex flex-col gap-2 md:w-[180px] justify-center">
                            <button class="accept-order-btn bg-primary text-white font-bold py-3 rounded-xl hover:scale-[1.02] transition-transform" data-order-id="${o.orderId}">
                                Accept Order
                            </button>
                            <button class="cancel-order-btn border-2 border-red-500 text-red-600 font-bold py-2 rounded-xl hover:bg-red-50 transition-colors" data-order-id="${o.orderId}">
                                Cancel
                            </button>
                        </div>`;
                    container.appendChild(card);
                });

                container.querySelectorAll('.cancel-order-btn').forEach(btn => {
                    btn.addEventListener('click', () => {
                        if (!confirm('Cancel this order? This cannot be undone and the customer will be notified.')) {
                            return;
                        }
                        btn.disabled = true;
                        btn.textContent = 'Cancelling...';
                        fetch('deliveryAgent?action=cancelOrder', {
                            method: 'POST',
                            body: new URLSearchParams({ orderId: btn.dataset.orderId })
                        })
                            .then(r => r.json())
                            .then(result => {
                                if (!result.success) {
                                    alert(result.message || 'Could not cancel this order.');
                                }
                                loadAvailableOrders();
                            })
                            .catch(() => {
                                alert('Could not cancel this order. Please try again.');
                                loadAvailableOrders();
                            });
                    });
                });

                container.querySelectorAll('.accept-order-btn').forEach(btn => {
                    btn.addEventListener('click', () => {
                        btn.disabled = true;
                        btn.textContent = 'Accepting...';
                        fetch('deliveryAgent?action=acceptOrder', {
                            method: 'POST',
                            body: new URLSearchParams({ orderId: btn.dataset.orderId })
                        })
                            .then(r => r.json())
                            .then(result => {
                                if (!result.success) {
                                    alert(result.message || 'Could not accept this order.');
                                }
                                loadAvailableOrders();
                                loadOrders();
                            })
                            .catch(() => {
                                alert('Could not accept this order. Please try again.');
                                loadAvailableOrders();
                            });
                    });
                });
            })
            .catch(() => {});
    }

    loadOrders();
    setInterval(loadOrders, 15000);
    loadAvailableOrders();
    setInterval(loadAvailableOrders, 15000);

    // Share this agent's current GPS position periodically, so a new order placed nearby
    // can be auto-assigned to whichever available agent is actually closest to it. Silent
    // best-effort: if location access is denied, nothing here changes - the agent can still
    // be assigned orders manually by an admin exactly as before.
    function shareLocation() {
        if (!navigator.geolocation) return;
        navigator.geolocation.getCurrentPosition(
            function (position) {
                const params = new URLSearchParams({
                    latitude: position.coords.latitude,
                    longitude: position.coords.longitude
                });
                fetch('deliveryAgent?action=updateLocation', { method: 'POST', body: params }).catch(function () {});
            },
            function () { /* permission denied / unavailable - ignore */ },
            { enableHighAccuracy: true, timeout: 8000, maximumAge: 60000 }
        );
    }
    shareLocation();
    setInterval(shareLocation, 5 * 60 * 1000); // refresh every 5 minutes while the dashboard stays open

    // --- Notification bell: new-assignment alerts for this agent ---
    (function () {
        const bell = document.getElementById('notif-bell');
        const dropdown = document.getElementById('notif-dropdown');
        const badge = document.getElementById('notif-badge');
        const list = document.getElementById('notif-list');
        const toastContainer = document.getElementById('toast-container');
        const seenIds = new Set(JSON.parse(localStorage.getItem('fe_agent_seen_notifs') || '[]'));
        let dropdownOpen = false;
        let firstLoad = true;

        bell.addEventListener('click', function (e) {
            e.stopPropagation();
            dropdownOpen = !dropdownOpen;
            dropdown.classList.toggle('hidden', !dropdownOpen);
        });
        document.addEventListener('click', function (e) {
            if (dropdownOpen && !dropdown.contains(e.target) && !bell.contains(e.target)) {
                dropdownOpen = false;
                dropdown.classList.add('hidden');
            }
        });
        document.getElementById('notif-mark-all').addEventListener('click', function (e) {
            e.stopPropagation();
            fetch('notifications?action=markAllRead', { method: 'POST' }).then(loadNotifications);
        });

        function showToast(n) {
            const el = document.createElement('div');
            el.className = 'bg-white border border-gray-200 shadow-lg rounded-xl p-4';
            el.innerHTML = '<p class="font-bold text-sm text-secondary-container">' + n.title + '</p>'
                + '<p class="text-sm text-gray-600 mt-1">' + n.message + '</p>';
            toastContainer.appendChild(el);
            setTimeout(function () { el.remove(); }, 6000);
        }

        function timeAgo(ts) {
            if (!ts) return '';
            const diffMs = Date.now() - new Date(ts.replace(' ', 'T')).getTime();
            const mins = Math.round(diffMs / 60000);
            if (mins < 1) return 'just now';
            if (mins < 60) return mins + 'm ago';
            const hours = Math.round(mins / 60);
            if (hours < 24) return hours + 'h ago';
            return Math.round(hours / 24) + 'd ago';
        }

        function loadNotifications() {
            fetch('notifications?action=list')
                .then(function (r) { return r.ok ? r.json() : null; })
                .then(function (data) {
                    if (!data) return;
                    badge.textContent = data.unreadCount;
                    badge.classList.toggle('hidden', data.unreadCount === 0);

                    const notifications = data.notifications || [];
                    let newAssignment = false;
                    notifications.forEach(function (n) {
                        if (!seenIds.has(n.notificationId) && !n.isRead) {
                            showToast(n);
                            if (!firstLoad) newAssignment = true;
                        }
                        seenIds.add(n.notificationId);
                    });
                    localStorage.setItem('fe_agent_seen_notifs', JSON.stringify(Array.from(seenIds)));
                    firstLoad = false;
                    if (newAssignment) { loadOrders(); loadAvailableOrders(); }

                    list.innerHTML = '';
                    if (notifications.length === 0) {
                        list.innerHTML = '<p class="text-gray-400 text-sm p-4">No notifications yet.</p>';
                        return;
                    }
                    notifications.forEach(function (n) {
                        const row = document.createElement('div');
                        row.className = 'px-4 py-3 text-sm cursor-pointer hover:bg-gray-50 border-b border-gray-50 last:border-0 ' + (n.isRead ? '' : 'bg-orange-50/60');
                        row.innerHTML = '<p class="font-semibold ' + (n.isRead ? 'text-gray-600' : 'text-gray-900') + '">' + n.title + '</p>'
                            + '<p class="text-gray-500 mt-0.5">' + n.message + '</p>'
                            + '<p class="text-[11px] text-gray-400 mt-1">' + timeAgo(n.createdAt) + '</p>';
                        row.addEventListener('click', function () {
                            if (!n.isRead) {
                                fetch('notifications?action=markRead', { method: 'POST', body: new URLSearchParams({ notificationId: n.notificationId }) })
                                    .then(loadNotifications);
                            }
                        });
                        list.appendChild(row);
                    });
                })
                .catch(function () {});
        }

        loadNotifications();
        setInterval(loadNotifications, 6000);
    })();
</script>
</body></html>
